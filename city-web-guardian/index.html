rder-radius:8px}@media(max-width:560px){.title{top:58px}.mission{top:100px}.btn{width:41px;height:41px}.actions .btn{width:43px;height:43px}.pad{width:130px}}</style></head><body><div id="hud"><div class="panel">HERO <span id="hpv">100</span>%<div class="bar"><div id="hp" class="fill"></div></div>🪙 <span id="coins">0</span></div><div class="panel">IRON COLOSSUS <span id="bov">100</span>%<div class="bar"><div id="bo" class="fill boss"></div></div></div></div><div class="title">CITY <b>WEB</b> GUARDIAN 3D</div><div class="mission">MISSION: Defeat Iron Colossus</div><button id="pause">Ⅱ</button><div class="controls"><div class="pad"><button class="btn" data-k="forward">▲</button><button class="btn" data-k="left">◀</button><button class="btn" data-k="back">▼</button><button class="btn" data-k="right">▶</button></div><div class="actions"><button class="btn" data-k="web">✳</button><button class="btn" data-k="jump">⬆</button><button class="btn" data-k="punch">✊</button><button class="btn" data-k="dash">➤</button></div></div><div id="overlay" class="overlay"><div class="card"><h1>CITY WEB GUARDIAN 3D</h1><p>Explore a real 3D snowy neon city from behind your hero. Move in every direction, jump, dash and fight the giant armored boss.</p><button id="start" class="start">START MISSION</button><p>Keyboard: WASD or arrows, Space, J, K, Shift.</p></div></div><script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script>
(()=>{if(!window.THREE){document.querySelector('.card').innerHTML='<h2>3D engine needs internet</h2><p>Connect and reload the game.</p>';return}const scene=new THREE.Scene();scene.background=new THREE.Color(0x789bbd);scene.fog=new THREE.Fog(0x789bbd,35,110);const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,220);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;document.body.prepend(renderer.domElement);scene.add(new THREE.HemisphereLight(0xcceaff,0x1b2740,1.8));const sun=new THREE.DirectionalLight(0xffffff,2.2);sun.position.set(-20,40,20);sun.castShadow=true;scene.add(sun);const cityGlow=new THREE.PointLight(0x22aaff,50,55);cityGlow.position.set(-10,8,-10);scene.add(cityGlow);const mat=(c,m=.3,e=0)=>new THREE.MeshStandardMaterial({color:c,metalness:m,roughness:.4,emissive:e});const dark=mat(0x111b2c,.7),red=mat(0xff2450,.5,0x800020),steel=mat(0x647b94,.8),glass=mat(0x16476b,.6,0x0a2842),neon=mat(0x53cfff,.3,0x126baf);function box(p,w,h,d,m,x,y,z){let o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;p.add(o);return o}function capsule(p,r,h,m,x,y,z){let o=new THREE.Mesh(new THREE.CapsuleGeometry(r,h,4,8),m);o.position.set(x,y,z);o.castShadow=true;p.add(o);return o}const floor=new THREE.Mesh(new THREE.PlaneGeometry(160,160),mat(0x263d55));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);box(scene,15,.1,100,mat(0x17283b),0,.02,0);for(let z=-48;z<50;z+=5)box(scene,.15,.03,2,mat(0xf3f7ff),0,.1,z);for(let s of [-1,1])for(let i=0;i<12;i++){let h=11+(i*9%23),w=5+(i%3);let g=new THREE.Group();box(g,w,h,6,mat([0x172e4e,0x203d5e,0x293b55][i%3],.6),0,h/2,0);for(let y=1.5;y<h-1;y+=1.8)for(let x=-w/2+.7;x<w/2-.2;x+=1.1)box(g,.48,.65,.04,neon,x,y,3);g.position.set(s*(11+w/2),0,-48+i*9);scene.add(g)}const hero=new THREE.Group();box(hero,.8,1,.5,dark,0,1.45,0);box(hero,.18,.85,.53,red,0,1.45,.2);let head=new THREE.Mesh(new THREE.SphereGeometry(.34,18,14),dark);head.position.y=2.25;hero.add(head);box(hero,.42,.09,.1,neon,0,2.28,.3);let legs=[];for(let s of [-1,1]){capsule(hero,.16,.65,dark,s*.23,.55,0);box(hero,.23,.16,.38,red,s*.23,.12,.1);capsule(hero,.14,.62,dark,s*.52,1.48,0)}hero.position.set(0,0,12);scene.add(hero);const boss=new THREE.Group();box(boss,2.4,2.4,1.6,dark,0,1.9,0);box(boss,2.1,1,1.5,steel,0,3.1,0);box(boss,1.5,1,.9,steel,0,3.9,0);for(let s of [-1,1]){box(boss,.4,.13,.12,red,s*.38,4,.5);capsule(boss,.35,1.3,steel,s*1.4,2.5,0);capsule(boss,.4,1.2,dark,s*.5,.65,0)}boss.position.set(0,0,-22);scene.add(boss);const snowN=450,arr=new Float32Array(snowN*3);for(let i=0;i<snowN;i++){arr[i*3]=(Math.random()-.5)*65;arr[i*3+1]=Math.random()*28;arr[i*3+2]=(Math.random()-.5)*90}const sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.BufferAttribute(arr,3));scene.add(new THREE.Points(sg,new THREE.PointsMaterial({color:0xffffff,size:.13})));const keys={};let hp=100,bh=100,coins=0,playing=false,paused=false,vy=0,grounded=true,cd=0,dashcd=0,enemy=0;const $=id=>document.getElementById(id);function hud(){$('hpv').textContent=Math.ceil(hp);$('bov').textContent=Math.ceil(bh);$('coins').textContent=coins;$('hp').style.width=hp+'%';$('bo').style.width=bh+'%'}function reset(){hero.position.set(0,0,12);boss.position.set(0,0,-22);hp=bh=100;coins=0;vy=0;grounded=true;cd=dashcd=enemy=0;hud()}function end(win){playing=false;$('overlay').classList.remove('hidden');$('overlay').innerHTML='<div class="card"><h1>'+(win?'CITY SAVED!':'MISSION FAILED')+'</h1><p>Coins: '+coins+'</p><button class="start" id="again">PLAY AGAIN</button></div>';$('again').onclick=()=>{reset();$('overlay').classList.add('hidden');playing=true}}function hit(n){if(cd>0)return;cd=.5;if(hero.position.distanceTo(boss.position)<10){bh=Math.max(0,bh-n);coins+=2;hud()}}document.querySelectorAll('[data-k]').forEach(b=>{let k=b.dataset.k;b.onpointerdown=e=>{e.preventDefault();keys[k]=true;b.setPointerCapture(e.pointerId)};['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false))});const map={w:'forward',ArrowUp:'forward',s:'back',ArrowDown:'back',a:'left',ArrowLeft:'left',d:'right',ArrowRight:'right',' ':'jump',j:'web',k:'punch',Shift:'dash'};onkeydown=e=>{if(map[e.key]){e.preventDefault();keys[map[e.key]]=true}};onkeyup=e=>{if(map[e.key])keys[map[e.key]]=false};$('start').onclick=()=>{reset();$('overlay').classList.add('hidden');playing=true};$('pause').onclick=()=>{paused=!paused};const clock=new THREE.Clock();function frame(){requestAnimationFrame(frame);let dt=Math.min(clock.getDelta(),.04);if(playing&&!paused){let f=(keys.forward?1:0)-(keys.back?1:0),s=(keys.right?1:0)-(keys.left?1:0);if(f||s){let a=Math.atan2(s,f);hero.rotation.y=a;hero.position.x+=Math.sin(a)*dt*8;hero.position.z-=Math.cos(a)*dt*8}hero.position.x=THREE.MathUtils.clamp(hero.position.x,-5.5,5.5);hero.position.z=THREE.MathUtils.clamp(hero.position.z,-42,25);if(keys.jump&&grounded){vy=9;grounded=false;keys.jump=false}vy-=22*dt;hero.position.y=Math.max(0,hero.position.y+vy*dt);if(hero.position.y===0){vy=0;grounded=true}if(keys.dash&&dashcd<=0){hero.position.x+=Math.sin(hero.rotation.y)*3;hero.position.z-=Math.cos(hero.rotation.y)*3;dashcd=1.2;keys.dash=false}if(keys.web){hit(8);keys.web=false}if(keys.punch){hit(12);keys.punch=false}cd=Math.max(0,cd-dt);dashcd=Math.max(0,dashcd-dt);enemy+=dt;if(enemy>2.2){enemy=0;if(hero.position.distanceTo(boss.position)<17){hp=Math.max(0,hp-8);hud()}}let offset=new THREE.Vector3(0,7,12).applyAxisAngle(new THREE.Vector3(0,1,0),hero.rotation.y);camera.position.lerp(hero.position.clone().add(offset),.1);camera.lookAt(hero.position.x,hero.position.y+1.5,hero.position.z-3);const p=sg.attributes.position.array;for(let i=0;i<snowN;i++){p[i*3+1]-=dt*2.5;if(p[i*3+1]<0)p[i*3+1]=28}sg.attributes.position.needsUpdate=true;if(hp<=0)end(false);if(bh<=0)end(true)}renderer.render(scene,camera)}camera.position.set(0,8,26);camera.lookAt(0,1,0);frame();onresize=()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}})();</script></body></html>
