<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Cloud Hopper: The Sky Is Falling</title><style>*{box-sizing:border-box}body{margin:0;background:#071b3a;color:white;font-family:system-ui,sans-serif;text-align:center}h1{font-size:clamp(20px,5vw,30px);margin:12px 8px 4px}p{margin:4px 8px 10px;color:#d9edff}canvas{display:block;width:min(96vw,480px);height:auto;max-height:68vh;margin:auto;border:3px solid #a9e5ff;border-radius:14px;background:#70d5ff;touch-action:manipulation}button{font-size:19px;font-weight:700;padding:12px 22px;margin:9px 5px;border:0;border-radius:12px;background:#ffcf40;color:#17305a}#hud{font-weight:700;font-size:18px}</style></head><body><h1>☁️ Cloud Hopper: The Sky Is Falling!</h1><p>Hop on clouds, collect coins, and dodge lightning.</p><div id="hud">Coins: 0</div><canvas id="game" width="420" height="600"></canvas><div><button id="start">Start / Restart</button><button id="jump">JUMP ⬆</button></div><p>Tap JUMP or the game screen to hop.</p><script>
const c=document.getElementById('game'),ctx=c.getContext('2d'),hud=document.getElementById('hud');let boy,clouds,coins,bolts,score,playing,over,frame,keys={};function reset(){boy={x:190,y:475,vy:0,w:30,h:42};clouds=[];for(let i=0;i<7;i++)clouds.push({x:(i*73)%360,y:530-i*82,w:78});coins=[];bolts=[];score=0;frame=0;playing=true;over=false;hud.textContent='Coins: 0';}function jump(){if(!playing||over){reset();return}if(boy.vy===0||boy.y>450)boy.vy=-12;}document.getElementById('start').onclick=reset;document.getElementById('jump').onclick=jump;c.addEventListener('pointerdown',e=>{e.preventDefault();jump()});function drawCloud(x,y,w){ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(x+w*.5,y,w*.48,12,0,0,7);ctx.ellipse(x+w*.3,y-7,16,13,0,0,7);ctx.ellipse(x+w*.58,y-10,20,17,0,0,7);ctx.fill()}function tick(){ctx.clearRect(0,0,420,600);let sky=ctx.createLinearGradient(0,0,0,600);sky.addColorStop(0,'#4caeff');sky.addColorStop(1,'#d4f7ff');ctx.fillStyle=sky;ctx.fillRect(0,0,420,600);ctx.fillStyle='#ffed9a';ctx.beginPath();ctx.arc(350,70,34,0,7);ctx.fill();if(playing&&!over){frame++;boy.vy+=.42;boy.y+=boy.vy;if(boy.y<190){let d=190-boy.y;boy.y=190;clouds.forEach(a=>a.y+=d);coins.forEach(a=>a.y+=d);bolts.forEach(a=>a.y+=d)}if(frame%65===0)clouds.push({x:Math.random()*330,y:610,w:65+Math.random()*25});if(frame%105===0)coins.push({x:30+Math.random()*360,y:550});if(frame%160===0)bolts.push({x:25+Math.random()*370,y:-20});clouds.forEach(a=>a.y+=1.2);coins.forEach(a=>a.y+=1.2);bolts.forEach(a=>a.y+=2.7);clouds=clouds.filter(a=>a.y<650);coins=coins.filter(a=>a.y<650);bolts=bolts.filter(a=>a.y<650);if(boy.vy>0)clouds.forEach(a=>{if(boy.x+boy.w>a.x&&boy.x<a.x+a.w&&boy.y+boy.h>=a.y-8&&boy.y+boy.h<=a.y+17){boy.y=a.y-boy.h;boy.vy=0}});coins=coins.filter(a=>{if(Math.abs((boy.x+15)-a.x)<25&&Math.abs((boy.y+20)-a.y)<30){score++;hud.textContent='Coins: '+score;return false}return true});if(boy.y>610||bolts.some(a=>Math.abs(a.x-(boy.x+15))<24&&Math.abs(a.y-(boy.y+20))<35)){over=true;playing=false}}clouds.forEach(a=>drawCloud(a.x,a.y,a.w));coins.forEach(a=>{ctx.fillStyle='#ffca28';ctx.beginPath();ctx.arc(a.x,a.y,10,0,7);ctx.fill();ctx.strokeStyle='#fff2a3';ctx.lineWidth=3;ctx.stroke()});bolts.forEach(a=>{ctx.fillStyle='#6741d9';ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(a.x-10,a.y+20);ctx.lineTo(a.x,a.y+19);ctx.lineTo(a.x-7,a.y+38);ctx.lineTo(a.x+12,a.y+14);ctx.lineTo(a.x+3,a.y+15);ctx.closePath();ctx.fill()});ctx.fillStyle='#1c3260';ctx.beginPath();ctx.arc(boy.x+15,boy.y+7,12,0,7);ctx.fill();ctx.fillStyle='#ffbd80';ctx.beginPath();ctx.arc(boy.x+15,boy.y+8,8,0,7);ctx.fill();ctx.fillStyle='#ff4e70';ctx.fillRect(boy.x+3,boy.y+17,24,20);ctx.fillStyle='#203b70';ctx.fillRect(boy.x+5,boy.y+35,7,9);ctx.fillRect(boy.x+19,boy.y+35,7,9);if(over){ctx.fillStyle='rgba(5,20,50,.72)';ctx.fillRect(20,220,380,130);ctx.fillStyle='white';ctx.textAlign='center';ctx.font='bold 30px system-ui';ctx.fillText('GAME OVER',210,265);ctx.font='20px system-ui';ctx.fillText('Coins collected: '+score,210,303);ctx.fillText('Tap Start / Restart to play again',210,332)}else if(!playing){ctx.fillStyle='rgba(5,20,50,.55)';ctx.fillRect(20,220,380,100);ctx.fillStyle='white';ctx.textAlign='center';ctx.font='bold 27px system-ui';ctx.fillText('Ready to hop?',210,260);ctx.font='17px system-ui';ctx.fillText('Press Start / Restart',210,292)}requestAnimationFrame(tick)}reset();playing=false;tick();
</script></body></html>
