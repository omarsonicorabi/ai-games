 case 6: ctx.moveTo(0,-31);ctx.lineTo(29,14);ctx.lineTo(12,11);ctx.lineTo(0,27);ctx.lineTo(-12,11);ctx.lineTo(-29,14);break;
 case 7: ctx.moveTo(0,-25);ctx.lineTo(8,-8);ctx.lineTo(25,2);ctx.lineTo(25,8);ctx.lineTo(7,5);ctx.lineTo(7,18);ctx.lineTo(17,25);ctx.lineTo(17,29);ctx.lineTo(0,26);ctx.lineTo(-17,29);ctx.lineTo(-17,25);ctx.lineTo(-7,18);ctx.lineTo(-7,5);ctx.lineTo(-25,8);ctx.lineTo(-25,2);ctx.lineTo(-8,-8);break;
 case 8: ctx.moveTo(0,-27);ctx.lineTo(7,-3);ctx.lineTo(31,8);ctx.lineTo(31,13);ctx.lineTo(7,9);ctx.lineTo(8,21);ctx.lineTo(0,29);ctx.lineTo(-8,21);ctx.lineTo(-7,9);ctx.lineTo(-31,13);ctx.lineTo(-31,8);ctx.lineTo(-7,-3);break;
 default: ctx.moveTo(0,-30);ctx.lineTo(10,-7);ctx.lineTo(31,11);ctx.lineTo(20,15);ctx.lineTo(8,10);ctx.lineTo(8,22);ctx.lineTo(18,27);ctx.lineTo(0,25);ctx.lineTo(-18,27);ctx.lineTo(-8,22);ctx.lineTo(-8,10);ctx.lineTo(-20,15);ctx.lineTo(-31,11);ctx.lineTo(-10,-7);break;
 }
 ctx.closePath();ctx.fill();ctx.stroke();
 ctx.fillStyle='#eafaff';ctx.beginPath();ctx.ellipse(0,-4,4,10,0,0,Math.PI*2);ctx.fill();
 if(index===2){ctx.beginPath();ctx.moveTo(-24,-12);ctx.lineTo(24,-12);ctx.stroke();}
 if(index===7){ctx.strokeStyle='#d7f5ff';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-24,-28);ctx.lineTo(24,-28);ctx.moveTo(0,-30);ctx.lineTo(0,-39);ctx.stroke();}
 ctx.restore();
}
function cloud(x,y,r,alpha=1){
 ctx.save();ctx.globalAlpha=alpha;ctx.fillStyle='#eaf8ff';ctx.beginPath();ctx.arc(x-r*.45,y,r*.5,0,Math.PI*2);ctx.arc(x,y-r*.22,r*.62,0,Math.PI*2);ctx.arc(x+r*.48,y,r*.45,0,Math.PI*2);ctx.ellipse(x,y+r*.16,r*.9,r*.32,0,0,Math.PI*2);ctx.fill();ctx.restore();
}
function drawDrop(d){
 if(d.type===0){cloud(d.x,d.y,d.r,.92);}
 else if(d.type===1){ctx.save();ctx.translate(d.x,d.y);ctx.rotate(Math.sin(d.y/20)*.15);rounded(-12,-15,24,30,5,'#45e879');txt('$',0,0,21,'#063c2b','900');ctx.restore();}
 else{ctx.save();ctx.translate(d.x,d.y);ctx.strokeStyle='#ffe66d';ctx.lineWidth=7;ctx.beginPath();ctx.arc(0,0,13,0,Math.PI*2);ctx.stroke();ctx.strokeStyle='#fff4ae';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,7,0,Math.PI*2);ctx.stroke();ctx.restore();}
}
function drawBackground(t){
 const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#168fe8');g.addColorStop(.52,'#0860b2');g.addColorStop(1,'#041b4b');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 for(let i=0;i<30;i++){let x=(i*173+30)%W,y=((i*97+t*.025)%H);ctx.fillStyle='rgba(255,255,255,.23)';ctx.beginPath();ctx.arc(x,y,1.5+(i%3),0,Math.PI*2);ctx.fill();}
 for(let i=0;i<7;i++){let x=(i*137+35)%W,y=(i*91+110)%H*.76;cloud(x,y,20,.18);}
 // distant floating islands
 for(let i=0;i<3;i++){let x=(i*260+70)%W,y=H*.18+(i%2)*65;ctx.fillStyle='#174c79';ctx.beginPath();ctx.moveTo(x-48,y);ctx.quadraticCurveTo(x,y-22,x+48,y);ctx.lineTo(x+20,y+23);ctx.lineTo(x-15,y+28);ctx.closePath();ctx.fill();ctx.fillStyle='#2abf90';ctx.fillRect(x-36,y-4,72,5);}
}
function startGame(){cash=0;collected=0;rings=0;elapsed=0;speed=3;drops=[];px=W/2;py=H*.68;startedAt=performance.now();lastTime=startedAt;spawn=0;shieldUntil=0;state='playing';}
function buyShield(){if(state!=='playing')return;if(performance.now()<shieldUntil){showToast('SHIELD IS ALREADY ON');return;}if(cash<25){showToast('YOU NEED 25 COINS FOR A SHIELD');return;}cash-=25;shieldUntil=performance.now()+300000;showToast('SHIELD ON FOR 5 MINUTES!');}
function showToast(s){toast=s;toastUntil=performance.now()+1800;}
function update(dt,now){
 if(state!=='playing')return;
 elapsed=Math.floor((now-startedAt)/1000);speed=Math.min(3+elapsed*.22,16);
 px=clamp(px+moveX*260*dt,35,W-35);py=clamp(py+moveY*260*dt,H*.20,H-90);
 const shield=now<shieldUntil;
 spawn-=dt;
 if(spawn<=0){let roll=Math.random();let type=roll<.54?0:roll<.88?1:2;drops.push({x:35+Math.random()*(W-70),y:-35,r:type===0?25:17,type,vy:(speed+Math.random()*1.4)*22});spawn=Math.max(.16,.78-elapsed*.006)*(0.55+Math.random()*.8);}
 for(let i=drops.length-1;i>=0;i--){let d=drops[i];d.y+=d.vy*dt;
  if(Math.abs(d.x-px)<d.r+20&&Math.abs(d.y-py)<d.r+24){
   if(d.type===1){cash++;collected++;drops.splice(i,1);continue;}
   if(d.type===2){cash+=5;collected+=5;rings++;drops.splice(i,1);continue;}
   if(shield){drops.splice(i,1);continue;}
   best=Math.max(best,collected);state='over';break;
  }
  if(d.y>H+50)drops.splice(i,1);
 }
}
function drawHUD(now){
 rounded(12,12,W-24,48,14,'rgba(3,22,54,.82)');
 txt('🪙 '+cash,85,36,23,'#64ff9a','800');txt('RINGS '+rings,235,36,17,'#ffe26a','800');
 txt(now<shieldUntil?'SHIELD ON':'SHIELD OFF',410,36,16,now<shieldUntil?'#66ff8b':'#fff','800');
 txt(elapsed+'s  ×'+(speed/3).toFixed(1),605,36,16,'#fff','800');
 if(now<shieldUntil){txt('SHIELD '+Math.ceil((shieldUntil-now)/1000)+'s',W/2,78,13,'#83ffb0','700');}
}
function button(x,y,w,h,label,fill,fn){rounded(x,y,w,h,13,fill);txt(label,x+w/2,y+h/2,18,'#fff','800');}
function drawMenu(){
 rounded(20,20,W-40,H-40,28,'rgba(5,29,67,.94)');
 txt('THE HIGH SKY',W/2,52,39,'#ffe26a','900');
 const tabs=[['airplanes','✈ AIRPLANES (25)'],['shields','🛡 SHIELDS (25)'],['colors','🎨 COLORS (30)']];
 tabs.forEach((t,i)=>{const x=32+i*222,active=menuTab===t[0];rounded(x,76,214,39,11,active?'#167fc5':'#12345f');txt(t[1],x+107,96,14,active?'#ffe26a':'#fff','900');});
 if(menuTab==='airplanes'){
  txt('AIRPLANE LIST — TAP ONE TO CHOOSE',W/2,137,16,'#65e6ff','900');
  for(let i=0;i<names.length;i++){let col=i%2,row=Math.floor(i/2),x=36+col*330,y=151+row*37;rounded(x,y,318,33,9,i===plane?'#167fc5':'#12345f');if(i===plane){ctx.strokeStyle='#ffe26a';ctx.lineWidth=2;ctx.strokeRect(x+2,y+2,314,29);}drawSprite(x+29,y+16,47,30,i);txt((i+1)+'. '+names[i],x+185,y+17,13,'#fff','800');}
  txt('Selected: '+names[plane],W/2,650,15,'#ffe26a','800');
 }else if(menuTab==='shields'){
  txt('SHIELD LIST — TAP ONE TO CHOOSE',W/2,137,16,'#65e6ff','900');
  shieldNames.forEach((n,i)=>{const col=i%5,row=Math.floor(i/5),x=42+col*129,y=153+row*82;rounded(x,y,120,73,9,i===shieldIndex?'#167fc5':'#12345f');ctx.strokeStyle=shieldColors[i];ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x+60,y+8);ctx.lineTo(x+88,y+18);ctx.lineTo(x+82,y+47);ctx.lineTo(x+60,y+62);ctx.lineTo(x+38,y+47);ctx.lineTo(x+32,y+18);ctx.closePath();ctx.stroke();txt(n,x+60,y+67,9,'#fff','800');});
  txt('Selected: '+shieldNames[shieldIndex]+' · costs 25 coins · lasts 5 minutes',W/2,590,13,'#ffe26a','800');
 }else{
  txt('COLOR LIST — TAP ONE TO CHOOSE',W/2,137,16,'#65e6ff','900');
  colors.forEach((col,i)=>{const x=85+(i%6)*110,y=171+Math.floor(i/6)*75;ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,19,0,Math.PI*2);ctx.fill();ctx.strokeStyle=i===colorIndex?'#fff':'#12345f';ctx.lineWidth=i===colorIndex?4:2;ctx.stroke();txt(colorNames[i],x,y+31,10,'#fff','700');});
  drawSprite(W/2,580,90,70,plane);txt('Selected color: '+colorNames[colorIndex],W/2,640,15,'#ffe26a','800');
 }
 rounded(135,665,450,43,14,'#11a5e8');txt('▶  START FLIGHT',W/2,687,20,'#fff','900');
 txt('Collect coins + gold rings (+5 coins) · Avoid clouds',W/2,718,12,'#d8f4ff','600');
}
function drawControls(){
 rounded(12,H-70,W-24,56,18,'rgba(3,22,54,.78)');
 txt('◀',95,H-42,30,'#fff','900');txt('▲',235,H-42,26,'#fff','900');txt('▼',345,H-42,26,'#fff','900');txt('▶',455,H-42,30,'#fff','900');txt('B: SHIELD 25 COINS',610,H-42,15,'#ffe26a','900');
}
function drawOverlay(){
 ctx.fillStyle='rgba(2,13,35,.78)';ctx.fillRect(0,0,W,H);
 rounded(65,165,W-130,390,26,'rgba(8,37,77,.98)');
 if(state==='over'){
  txt('FLIGHT OVER',W/2,218,38,'#ffe26a','900');txt('You flew for '+elapsed+' seconds',W/2,270,20,'#fff','700');
  txt('Coins collected: '+collected,W/2,322,24,'#65ff9d','800');txt('Rings collected: '+rings,W/2,360,19,'#ffe26a','800');txt('Best coins: '+best,W/2,397,18,'#cceaff','700');
  rounded(140,440,440,64,16,'#11a5e8');txt('↻  PLAY AGAIN',W/2,472,24,'#fff','900');
  txt('Tap to return to the airplane menu',W/2,532,15,'#d8f4ff','600');
 }else{
  txt('PAUSED',W/2,260,40,'#ffe26a','900');txt('Take a breath, pilot.',W/2,320,20,'#fff','700');
  rounded(140,390,440,64,16,'#11a5e8');txt('RESUME FLIGHT',W/2,422,23,'#fff','900');
  txt('Tap the screen or press P to resume',W/2,490,15,'#d8f4ff','600');
 }
}
function draw(now){
 drawBackground(now);
 if(state==='menu'){drawMenu();return;}
 for(const d of drops)drawDrop(d);
 const shield=now<shieldUntil;
 drawSprite(px,py,88,72,plane);
 if(shield){ctx.strokeStyle=shieldColors[shieldIndex];ctx.lineWidth=5;ctx.beginPath();ctx.arc(px,py,45,0,Math.PI*2);ctx.stroke();ctx.strokeStyle=shieldColors[shieldIndex]+'55';ctx.lineWidth=12;ctx.beginPath();ctx.arc(px,py,48,0,Math.PI*2);ctx.stroke();}
 drawHUD(now);drawControls();
 if(toast&&now<toastUntil){rounded(100,90,520,42,12,'rgba(2,22,48,.88)');txt(toast,W/2,111,17,'#ffe26a','800');}
 if(state==='over'||state==='paused')drawOverlay();
}
function frame(now){let dt=Math.min(.04,(now-(lastTime||now))/1000);lastTime=now;update(dt,now);draw(now);requestAnimationFrame(frame);}
function pos(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};}
function handleTap(x,y){
 if(state==='menu'){
  if(y>=76&&y<116){if(x<250)menuTab='airplanes';else if(x<470)menuTab='shields';else menuTab='colors';return;}
  if(menuTab==='airplanes'&&y>=149&&y<630){let col=x<360?0:1,row=Math.floor((y-151)/37),idx=row*2+col;if(idx>=0&&idx<names.length){plane=idx;return;}}
  if(menuTab==='shields'&&y>=151&&y<565){let col=Math.floor((x-42)/129),row=Math.floor((y-153)/82),idx=row*5+col;if(col>=0&&col<5&&row>=0&&row<5&&idx<shieldNames.length){shieldIndex=idx;return;}}
  if(menuTab==='colors'&&y>=151&&y<520){let col=Math.round((x-85)/110),row=Math.round((y-171)/75),idx=row*6+col,cx=85+col*110,cy=171+row*75;if(col>=0&&col<6&&row>=0&&row<5&&idx<colors.length&&Math.abs(x-cx)<40&&Math.abs(y-cy)<42){colorIndex=idx;return;}}
  if(y>=660){startGame();return;}return;
 }
 if(state==='over'){if(y>420&&y<520){startGame();}else if(y<410){state='menu';}return;}
 if(state==='paused'){state='playing';lastTime=performance.now();return;}
 if(y>H-78){if(x<160)moveX=-1;else if(x<285)moveY=-1;else if(x<400)moveY=1;else if(x<515)moveX=1;else buyShield();setTimeout(()=>{moveX=0;moveY=0;},170);return;}
 if(x>W*.78&&y<110){buyShield();return;}
 px=clamp(x,35,W-35);py=clamp(y,H*.2,H-90);
}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.setPointerCapture?.(e.pointerId);const q=pos(e);pointer=q;handleTap(q.x,q.y);});
canvas.addEventListener('pointermove',e=>{if(!pointer||state!=='playing')return;const q=pos(e);if(q.y<H-80){px=clamp(q.x,35,W-35);py=clamp(q.y,H*.2,H-90);}pointer=q;});
canvas.addEventListener('pointerup',()=>{pointer=null;moveX=moveY=0;});
canvas.addEventListener('pointercancel',()=>{pointer=null;moveX=moveY=0;});
window.addEventListener('keydown',e=>{
 const k=e.key.toLowerCase();if(['arrowleft','arrowright','arrowup','arrowdown',' '].includes(k))e.preventDefault();
 if(k==='p'){if(state==='playing')state='paused';else if(state==='paused')state='playing';return;}
 if(k==='b'){buyShield();return;}
 if(state==='menu'){if(k==='enter'||k===' '){startGame();return;}if(k==='arrowleft')plane=(plane+24)%25;if(k==='arrowright')plane=(plane+1)%25;return;}
 if(state==='over'){if(k==='enter'||k===' '){startGame();}return;}
 if(state!=='playing')return;
 if(k==='arrowleft'||k==='a')moveX=-1;if(k==='arrowright'||k==='d')moveX=1;if(k==='arrowup'||k==='w')moveY=-1;if(k==='arrowdown'||k==='s')moveY=1;
});
window.addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k==='arrowleft'||k==='a'){if(moveX<0)moveX=0;}if(k==='arrowright'||k==='d'){if(moveX>0)moveX=0;}if(k==='arrowup'||k==='w'){if(moveY<0)moveY=0;}if(k==='arrowdown'||k==='s'){if(moveY>0)moveY=0;}});
requestAnimationFrame(frame);
})();
</script>
