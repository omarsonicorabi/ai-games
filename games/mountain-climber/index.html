<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mountain Climber</title>
<style>
  *{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#8bd8ff;font-family:system-ui,Arial,sans-serif;touch-action:none}
  canvas{display:block;width:100vw;height:100dvh}
  #hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;color:#17334b;font-weight:800;text-shadow:0 1px 0 #fff8;pointer-events:none}
  .pill{background:#ffffffd9;border:2px solid #ffffffaa;border-radius:18px;padding:8px 12px;box-shadow:0 3px 0 #427b9b33}
  #overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:#12334b55}
  .panel{width:min(430px,100%);text-align:center;background:#fff8e8;border:4px solid white;border-radius:26px;padding:24px 20px;box-shadow:0 10px 0 #24506b55;color:#18354b}
  h1{font-size:clamp(30px,8vw,48px);line-height:1;margin:4px 0 12px} p{line-height:1.45}
  button{border:0;border-radius:16px;background:#ffb52e;color:#402900;font-size:20px;font-weight:900;padding:13px 22px;box-shadow:0 5px 0 #d27b13;cursor:pointer}
  button:active{transform:translateY(3px);box-shadow:0 2px 0 #d27b13}
  #controls{position:fixed;bottom:18px;left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;pointer-events:none}
  .control{pointer-events:auto;width:72px;height:66px;border-radius:22px;background:#fffde8dd;border:3px solid #fff;box-shadow:0 5px 0 #407a9a66;color:#17334b;font-size:27px}
  #jump{width:96px;background:#ffcf59ee}
  .small{font-size:13px;opacity:.8}
</style>

<!-- Google Analytics 4 -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-0FXD7H5Z7D"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-0FXD7H5Z7D');
</script>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"><div class="pill">🪙 <span id="coins">0</span></div><div class="pill">🏔️ Height: <span id="height">0</span> m</div><div class="pill">❤️ <span id="lives">3</span></div></div>
<div id="controls">
  <button class="control" id="left" aria-label="Move left">◀</button>
  <button class="control" id="jump" aria-label="Jump">⬆ JUMP</button>
  <button class="control" id="right" aria-label="Move right">▶</button>
</div>
<div id="overlay"><div class="panel"><div style="font-size:52px">🧗‍♂️</div><h1>Mountain<br>Climber</h1><p>Climb the giant mountain! Jump between rocky ledges, collect shiny coins, and reach the snowy summit.</p><p class="small">Use ◀ ▶ and JUMP, or your keyboard arrow keys / spacebar.</p><button id="start">START CLIMBING</button></div></div>
<script>
(()=>{
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const coinEl=document.getElementById('coins'),heightEl=document.getElementById('height'),livesEl=document.getElementById('lives'),overlay=document.getElementById('overlay'),startBtn=document.getElementById('start');
let W=0,H=0,scale=1,keys={left:false,right:false},running=false,gameOver=false,coins=0,lives=3,camera=0,highest=0,platforms=[],pickups=[],particles=[],player;
function resize(){scale=devicePixelRatio||1;W=innerWidth;H=innerHeight;canvas.width=Math.floor(W*scale);canvas.height=Math.floor(H*scale);ctx.setTransform(scale,0,0,scale,0,0)}
addEventListener('resize',resize);resize();
function makePlatform(x,y,w){return{x,y,w,h:15,kind:Math.random()<.25?'ice':'rock'}}
function reset(){
 coins=0;lives=3;camera=0;highest=0;platforms=[];pickups=[];particles=[];
 player={x:W*.5,y:H-150,vx:0,vy:0,w:30,h:42,ground:false,invuln:0};
 platforms.push(makePlatform(W*.18,H-72,W*.64));
 let y=H-150;
 for(let i=0;i<20;i++){y-=70+Math.random()*24;let w=85+Math.random()*65;let x=20+Math.random()*(W-w-40);platforms.push(makePlatform(x,y,w));if(Math.random()<.78)pickups.push({x:x+w/2,y:y-23,r:10,taken:false})}
}
function addMore(){let top=Math.min(...platforms.map(p=>p.y));while(top>camera-500){top-=75+Math.random()*25;let w=85+Math.random()*65;let x=16+Math.random()*(W-w-32);platforms.push(makePlatform(x,top,w));if(Math.random()<.8)pickups.push({x:x+w/2,y:top-23,r:10,taken:false})}}
function start(){reset();running=true;gameOver=false;overlay.style.display='none';}
startBtn.addEventListener('click',start);
function setKey(k,v){keys[k]=v}
[['left','left'],['right','right']].forEach(([id,k])=>{let b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();setKey(k,true)});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>setKey(k,false)))});
document.getElementById('jump').addEventListener('pointerdown',e=>{e.preventDefault();jump()});
addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp',' ','a','d','w'].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft'||e.key==='a')keys.left=true;if(e.key==='ArrowRight'||e.key==='d')keys.right=true;if(e.key==='ArrowUp'||e.key===' '||e.key==='w')jump();if(gameOver&&e.key==='Enter')start()});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=false;if(e.key==='ArrowRight'||e.key==='d')keys.right=false});
function jump(){if(running&&player&&player.ground){player.vy=-25;player.ground=false;}}
function cloud(x,y,s){ctx.fillStyle='#ffffffb8';ctx.beginPath();ctx.arc(x,y,18*s,0,Math.PI*2);ctx.arc(x+22*s,y-9*s,24*s,0,Math.PI*2);ctx.arc(x+48*s,y,17*s,0,Math.PI*2);ctx.fill()}
function drawMountain(){
 let grad=ctx.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#80d7ff');grad.addColorStop(1,'#e4f8ff');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
 cloud((W*.12+camera*.12)%(W+130)-60,100,1);cloud((W*.72-camera*.08+W+100)%(W+100)-50,190,.75);
 // distant peaks
 ctx.fillStyle='#a5c9df';ctx.beginPath();ctx.moveTo(0,H);ctx.lineTo(W*.18,H*.5-camera*.06);ctx.lineTo(W*.4,H);ctx.lineTo(W*.65,H*.35-camera*.04);ctx.lineTo(W,H);ctx.fill();
 // main mountain
 ctx.fillStyle='#6e8795';ctx.beginPath();ctx.moveTo(-W*.3,H+camera);ctx.lineTo(W*.48,-camera*.12);ctx.lineTo(W*1.3,H+camera);ctx.closePath();ctx.fill();
 ctx.fillStyle='#d8edf4';ctx.beginPath();ctx.moveTo(W*.48,-camera*.12);ctx.lineTo(W*.37,H*.18-camera*.12);ctx.lineTo(W*.48,H*.25-camera*.12);ctx.lineTo(W*.56,H*.12-camera*.12);ctx.closePath();ctx.fill();
 // rocky slopes
 ctx.strokeStyle='#4c6878';ctx.lineWidth=3;
 for(let i=0;i<20;i++){let y=((i*137+camera*.45)%(H+150))-60;let x=(i*83)%W;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+18,y+13);ctx.lineTo(x+32,y+8);ctx.stroke()}
}
function drawPlatform(p){let y=p.y-camera;if(y<-40||y>H+30)return;ctx.fillStyle=p.kind==='ice'?'#b9f1ff':'#435d6b';ctx.beginPath();ctx.roundRect(p.x,y,p.w,p.h,7);ctx.fill();ctx.fillStyle=p.kind==='ice'?'#f2fdff':'#8ca2ad';ctx.beginPath();ctx.roundRect(p.x+3,y+2,p.w-6,5,4);ctx.fill();ctx.fillStyle='#314b59';ctx.fillRect(p.x+10,y+10,Math.max(8,p.w*.18),3)}
function drawPlayer(){let x=player.x,y=player.y;ctx.save();ctx.translate(x,y);
 // backpack
 ctx.fillStyle='#e77832';ctx.beginPath();ctx.roundRect(-16,-1,10,21,4);ctx.fill();
 // legs
 ctx.strokeStyle='#243f57';ctx.lineWidth=6;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-5,25);ctx.lineTo(-9,38);ctx.moveTo(6,25);ctx.lineTo(12,37);ctx.stroke();
 // body
 ctx.fillStyle='#f08b3e';ctx.beginPath();ctx.roundRect(-10,-2,20,30,7);ctx.fill();
 // head
 ctx.fillStyle='#ffd1a1';ctx.beginPath();ctx.arc(0,-11,12,0,Math.PI*2);ctx.fill();
 // helmet
 ctx.fillStyle='#ffcf36';ctx.beginPath();ctx.arc(0,-14,13,Math.PI,Math.PI*2);ctx.lineTo(13,-12);ctx.lineTo(-13,-12);ctx.fill();
 ctx.fillStyle='#17334b';ctx.beginPath();ctx.arc(4,-11,2,0,Math.PI*2);ctx.fill();
 // rope
 ctx.strokeStyle='#fff2bf';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(9,3);ctx.lineTo(18,11);ctx.stroke();
 ctx.restore()}
function update(){
 if(!running)return;
 player.vx=keys.left?-4.2:keys.right?4.2:player.vx*.82;player.x+=player.vx;player.x=Math.max(12,Math.min(W-12,player.x));
 let oldY=player.y;player.vy+=.42;player.y+=player.vy;player.ground=false;
 // Land only when descending onto a real platform. The air itself never allows a jump.
 const feetOffset=38;
 for(const p of platforms){let py=p.y-camera;if(player.vy>=0&&oldY+feetOffset<=py+5&&player.y+feetOffset>=py&&player.x>p.x-16&&player.x<p.x+p.w+16){player.y=py-feetOffset;player.vy=0;player.ground=true;}}
 if(player.y< H*.42){let d=H*.42-player.y;player.y+=d;camera+=d;highest=Math.max(highest,Math.floor(camera/10));}
 for(const c of pickups){if(!c.taken&&Math.hypot(player.x-c.x,player.y-(c.y-camera))<28){c.taken=true;coins++;for(let i=0;i<8;i++)particles.push({x:c.x,y:c.y-camera,vx:(Math.random()-.5)*4,vy:-Math.random()*4,life:25});}}
 particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.15;p.life--});particles=particles.filter(p=>p.life>0);
 if(player.y>H+60){lives--;livesEl.textContent=lives;if(lives<=0){endGame()}else{player.x=W/2;player.y=H*.35;player.vy=0;camera=Math.max(0,camera-120);player.invuln=60;}}
 platforms=platforms.filter(p=>p.y-camera<H+100);pickups=pickups.filter(c=>!c.taken&&c.y-camera<H+80);addMore();
 coinEl.textContent=coins;heightEl.textContent=highest;
}
function endGame(){running=false;gameOver=true;overlay.style.display='flex';overlay.querySelector('h1').innerHTML='Climb Over!';overlay.querySelector('p').innerHTML=`You climbed ${highest} meters and collected ${coins} coins. Try again and climb even higher!`;overlay.querySelector('.small').textContent='Tip: jump from ledge to ledge and keep moving.';startBtn.textContent='TRY AGAIN';}
function draw(){
 ctx.clearRect(0,0,W,H);drawMountain();
 if(player){platforms.forEach(drawPlatform);pickups.forEach(c=>{let y=c.y-camera;if(y>-30&&y<H+30){ctx.fillStyle='#ffc928';ctx.strokeStyle='#fff3a6';ctx.lineWidth=3;ctx.beginPath();ctx.arc(c.x,y,c.r,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#fff7c2';ctx.fillRect(c.x-2,y-6,4,12)}});particles.forEach(p=>{ctx.fillStyle='#ffcc35';ctx.beginPath();ctx.arc(p.x,p.y,p.life/6,0,Math.PI*2);ctx.fill()});drawPlayer();}
 requestAnimationFrame(loop)
}
function loop(){update();draw()}
reset();loop();
})();
</script>
</body>
</html>
