<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Brick Builder</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10213b;color:#fff;font-family:system-ui;text-align:center}header{padding:12px}h1{margin:4px}p{margin:4px;color:#c9d9ef}#bar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:8px}button{border:0;border-radius:12px;padding:10px 14px;font-weight:800;background:#f5c542;color:#17233a}#colors{display:flex;justify-content:center;gap:7px;padding:8px}.swatch{width:30px;height:30px;padding:0;border:2px solid white;border-radius:50%}#board{margin:8px auto;width:min(94vw,760px);height:min(62vh,520px);background:linear-gradient(#b8e8ff 0 70%,#72bd68 70%);border:5px solid #fff;border-radius:16px;display:grid;grid-template-columns:repeat(12,1fr);grid-template-rows:repeat(9,1fr);overflow:hidden;touch-action:manipulation}.cell{border:1px solid #ffffff55;min-width:0}.brick{border:2px solid #0003;border-radius:5px;box-shadow:inset 0 4px #ffffff55,inset 0 -4px #0002}#hint{padding:8px}
</style></head><body><header><h1>🧱 Brick Builder</h1><p>Build anything you imagine! Tap an empty square to place a brick. Tap a brick to remove it.</p></header>
<div id="colors"><button class="swatch" style="background:#e74c3c" data-color="#e74c3c"></button><button class="swatch" style="background:#3498db" data-color="#3498db"></button><button class="swatch" style="background:#f1c40f" data-color="#f1c40f"></button><button class="swatch" style="background:#2ecc71" data-color="#2ecc71"></button><button class="swatch" style="background:#9b59b6" data-color="#9b59b6"></button><button class="swatch" style="background:#fff" data-color="#fff"></button></div>
<div id="bar"><button id="clear">Clear build</button><button id="house">Build a house</button><button id="castle">Build a castle</button><a href="../../" style="color:white;align-self:center">← Arcade</a></div><div id="board"></div><div id="hint">Selected brick: red</div>
<script>
const board=document.querySelector('#board');let color='#e74c3c';const cells=[];for(let i=0;i<108;i++){let c=document.createElement('div');c.className='cell';c.onclick=()=>{if(c.dataset.brick){c.style.background='';c.classList.remove('brick');delete c.dataset.brick}else{c.style.background=color;c.classList.add('brick');c.dataset.brick='1'}};board.append(c);cells.push(c)}
document.querySelectorAll('.swatch').forEach(b=>b.onclick=()=>{color=b.dataset.color;document.querySelector('#hint').textContent='Selected brick: '+color});
function clear(){cells.forEach(c=>{c.style.background='';c.classList.remove('brick');delete c.dataset.brick})}
document.querySelector('#clear').onclick=clear;
function put(r,c,col){let x=cells[r*12+c];x.style.background=col;x.classList.add('brick');x.dataset.brick='1'}
document.querySelector('#house').onclick=()=>{clear();for(let r=4;r<8;r++)for(let c=3;c<9;c++)if(r===4||r===7||c===3||c===8)put(r,c,'#e74c3c');for(let c=4;c<8;c++)put(3,c,'#8e44ad');put(6,5,'#8b5a2b');put(6,6,'#8b5a2b');put(5,4,'#3498db');put(5,7,'#3498db')};
document.querySelector('#castle').onclick=()=>{clear();for(let r=3;r<8;r++)for(let c=2;c<10;c++)if(r===3||r===7||c===2||c===9)put(r,c,'#f1c40f');for(let c of [2,3,8,9]){put(2,c,'#e67e22');put(1,c,'#e67e22')}put(6,5,'#8b5a2b');put(6,6,'#8b5a2b')};
</script></body></html>
