<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Velocity Rush 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050914;font-family:Arial,sans-serif;touch-action:none}#game{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}
#hud{position:fixed;inset:0;color:#fff;pointer-events:none;text-shadow:0 2px 5px #000}#top{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start}.glass{background:#071323c9;border:1px solid #6ceaff66;border-radius:12px;padding:9px 13px;backdrop-filter:blur(8px);font-weight:900}#speed{font-size:30px;color:#75efff;font-style:italic}#nitroWrap{height:8px;width:130px;background:#ffffff40;border-radius:8px;margin-top:5px;overflow:hidden}#nitro{height:100%;width:100%;background:linear-gradient(90deg,#00cfff,#b6faff)}#raceInfo{font-size:12px;line-height:1.7}#raceInfo b{color:#7ceeff}#countdown{position:absolute;top:35%;width:100%;text-align:center;font-size:clamp(55px,15vw,110px);font-weight:1000;font-style:italic;color:white;text-shadow:0 0 25px #00bfff;pointer-events:none}#controls{position:absolute;bottom:16px;left:0;right:0;display:flex;justify-content:space-between;padding:0 15px;align-items:end;pointer-events:auto}#p2controls{display:none;position:absolute;bottom:92px;right:15px;gap:7px;pointer-events:auto}#p2controls .ctrl{width:49px;height:45px;font-size:17px}#p2tag{position:absolute;bottom:147px;right:20px;font-size:10px;font-weight:900;color:#ffdc8a;text-shadow:0 2px 5px #000}.cluster{display:flex;gap:9px}.ctrl{width:66px;height:61px;border:1px solid #a6edff99;border-radius:15px;background:#061a2ddd;color:white;font-size:26px;font-weight:900;touch-action:none}.ctrl:active{background:#087ba8}.boost{width:78px;height:72px;border-radius:50%;font-size:13px;background:linear-gradient(145deg,#ffbd32,#f04c19);border:2px solid #ffe3a2}.boost small{display:block;font-size:10px;margin-top:3px}
#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:18px;background:linear-gradient(110deg,#020817d9,#06182c88 55%,#020817d9);color:white;text-align:center}#card{width:min(460px,95vw);padding:27px 22px 23px;border:1px solid #75eaff88;border-radius:22px;background:linear-gradient(145deg,#0a1d32f5,#050b17f5);box-shadow:0 18px 70px #000c}#eyebrow{font-size:11px;letter-spacing:5px;color:#8ceeff;font-weight:900}h1{margin:9px 0 12px;font-size:clamp(37px,10vw,62px);line-height:.88;font-style:italic;font-weight:1000;letter-spacing:-2px;color:#fff;text-shadow:3px 4px 0 #087da5,0 0 24px #00bfff}#card p{color:#d4e8f5;line-height:1.5;font-size:14px}.modeRow{display:flex;gap:10px;margin-top:16px}.modeBtn{flex:1;min-width:0;padding:13px 8px;border:1px solid #62dff5;border-radius:11px;background:linear-gradient(145deg,#123b58,#09172a);color:#fff;font-weight:900;font-size:13px}.modeBtn span{display:block;font-size:10px;color:#9ddff0;font-weight:500;margin-top:5px}#start{margin-top:8px;padding:15px 34px;border:0;border-radius:10px;background:linear-gradient(100deg,#05c9ed,#236bff);color:white;font-size:17px;font-weight:1000;letter-spacing:1.5px;box-shadow:0 5px 24px #007dff66}#hint{font-size:11px;color:#a8c5d9;margin-top:13px}
@media(max-height:520px){#controls{bottom:7px}.ctrl{height:48px;width:57px}.boost{height:59px;width:65px}#card{padding:17px}#card p{margin:8px}}
</style></head><body><div id="game"></div>
<div id="hud" style="display:none"><div id="top"><div class="glass" id="raceInfo">POSITION <b id="position">4/4</b><br>LAP <b id="lap">1/2</b><br>TIME <b id="timer">0:00</b></div><div class="glass" style="text-align:right"><div><span id="speed">0</span> <span style="font-size:10px">KM/H</span></div><div id="nitroWrap"><div id="nitro"></div></div></div></div><div id="countdown"></div><div id="controls"><div class="cluster"><button class="ctrl" id="left">◀</button><button class="ctrl" id="right">▶</button></div><div class="cluster"><button class="ctrl" id="brake">BRAKE</button><button class="ctrl boost" id="boost">NITRO<small>HOLD</small></button></div></div><div id="p2tag">PLAYER 2</div><div id="p2controls"><button class="ctrl" id="p2left">◀</button><button class="ctrl" id="p2right">▶</button><button class="ctrl" id="p2boost">N₂</button></div></div>
<div id="overlay"><div id="card"><div id="eyebrow">NEON CITY GRAND PRIX</div><h1>VELOCITY<br>RUSH 3D</h1><p>Take the wheel. Race four supercars through a glowing city at night. Overtake rivals, drift through bends and fire your nitro to reach the finish first.</p><div class="modeRow"><button class="modeBtn" id="cpuMode">RACE VS CPU<span>Race against computer drivers</span></button><button class="modeBtn" id="duoMode">2 PLAYER<span>Race with family on one device</span></button></div><div id="hint">Choose your race mode to start</div></div></div>
<script src="../wonderworld-3d/three.min.js"></script><script>
(()=>{const mount=document.getElementById('game'),overlay=document.getElementById('overlay'),hud=document.getElementById('hud');if(!window.THREE){document.getElementById('card').innerHTML='<h1>3D ENGINE MISSING</h1><p>Reload the game to try again.</p>';return}
const scene=new THREE.Scene();scene.background=new THREE.Color(0x071326);scene.fog=new THREE.Fog(0x071326,65,230);
const camera=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,.1,450);camera.position.set(0,6.5,13);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;mount.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0x9bdcff,0x111827,1.8));const moon=new THREE.DirectionalLight(0xc8e8ff,2.1);moon.position.set(-18,30,15);moon.castShadow=true;scene.add(moon);
const colors={road:0x171d29,asphalt:0x222a38,white:0xeaf8ff,cyan:0x00dfff};const material=(c,r=.45,m=.25)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
const roadMat=material(colors.road,.92,.05),lineMat=material(0x91a9bf),curbA=material(0x00c9e8),curbB=material(0xf5f7ff),groundMat=material(0x101c2b,1,0);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(700,700),groundMat);ground.rotation.x=-Math.PI/2;ground.position.y=-.22;scene.add(ground);
const road=new THREE.Mesh(new THREE.PlaneGeometry(16,420),roadMat);road.rotation.x=-Math.PI/2;road.position.set(0,-.08,-165);road.receiveShadow=true;scene.add(road);
const shoulder=[];for(let s of [-1,1]){let q=new THREE.Mesh(new THREE.BoxGeometry(.55,.18,420),material(0x34465b));q.position.set(s*8.2,.0,-165);scene.add(q);let rail=new THREE.Mesh(new THREE.BoxGeometry(.16,.65,420),material(0x9bb7cb,.35,.65));rail.position.set(s*8.65,.38,-165);scene.add(rail)}
const dashes=[];for(let z=20;z>-390;z-=12){for(let x of [-2.65,2.65]){let d=new THREE.Mesh(new THREE.BoxGeometry(.13,.035,5),lineMat);d.position.set(x,.015,z);scene.add(d);dashes.push(d)}}
const curbs=[];for(let z=20;z>-400;z-=8)for(let s of [-1,1]){let c=new THREE.Mesh(new THREE.BoxGeometry(.42,.12,4),Math.floor((z+400)/8)%2?curbA:curbB);c.position.set(s*7.9,.02,z);scene.add(c);curbs.push(c)}
// Neon skyline, billboards and street lights
const city=[];for(let i=0;i<74;i++){let z=24-i*5.6;for(let s of [-1,1]){let w=4+Math.random()*5,h=9+Math.random()*31;let b=new THREE.Mesh(new THREE.BoxGeometry(w,h,4+Math.random()*4),material([0x172d49,0x263c58,0x18283e,0x35425a][i%4],.8,.25));b.position.set(s*(13+Math.random()*13),h/2-.1,z);b.castShadow=true;scene.add(b);let face=material(i%3?0x087caa:0x9c376e,.35,.3);let sign=new THREE.Mesh(new THREE.BoxGeometry(w*.72,.34,.08),face);sign.position.set(b.position.x,h*.62,z+2.05);scene.add(sign);city.push({b,sign,z,h,s})}}
const lamps=[];for(let i=0;i<38;i++){let z=18-i*11;for(let s of [-1,1]){let p=new THREE.Group();p.position.set(s*9,0,z);let pole=new THREE.Mesh(new THREE.CylinderGeometry(.07,.11,5,8),material(0x71869a,.35,.75));pole.position.y=2.5;p.add(pole);let arm=new THREE.Mesh(new THREE.BoxGeometry(.9,.08,.08),material(0x71869a));arm.position.set(-s*.4,4.8,0);p.add(arm);let bulb=new THREE.Mesh(new THREE.SphereGeometry(.2,8,8),new THREE.MeshBasicMaterial({color:0x5beaff}));bulb.position.set(-s*.8,4.72,0);p.add(bulb);scene.add(p);lamps.push(p)}} 
function makeCar(color){let g=new THREE.Group(),paint=material(color,.23,.72),black=material(0x080e18,.22,.3),windowMat=material(0x102c43,.16,.7),tire=material(0x05070b,.95,.02);let base=new THREE.Mesh(new THREE.BoxGeometry(1.95,.48,3.9),paint);base.position.y=.65;base.castShadow=true;g.add(base);let nose=new THREE.Mesh(new THREE.BoxGeometry(1.82,.22,1.2),paint);nose.position.set(0,.9,-1.35);g.add(nose);let cabin=new THREE.Mesh(new THREE.BoxGeometry(1.48,.68,1.72),windowMat);cabin.position.set(0,1.13,.1);g.add(cabin);let roof=new THREE.Mesh(new THREE.BoxGeometry(1.35,.12,1.35),paint);roof.position.set(0,1.49,.18);g.add(roof);let spoiler=new THREE.Mesh(new THREE.BoxGeometry(1.7,.09,.3),black);spoiler.position.set(0,1.12,1.78);g.add(spoiler);for(let x of [-1,1])for(let z of [-1.28,1.28]){let wheel=new THREE.Mesh(new THREE.CylinderGeometry(.39,.39,.25,18),tire);wheel.rotation.z=Math.PI/2;wheel.position.set(x,.4,z);g.add(wheel);let rim=new THREE.Mesh(new THREE.CylinderGeometry(.2,.2,.26,12),material(0x9db8ca,.25,.9));rim.rotation.z=Math.PI/2;rim.position.copy(wheel.position);g.add(rim)}for(let x of [-.62,.62]){let head=new THREE.Mesh(new THREE.BoxGeometry(.42,.14,.07),new THREE.MeshBasicMaterial({color:0x9df6ff}));head.position.set(x,.74,-1.98);g.add(head);let tail=new THREE.Mesh(new THREE.BoxGeometry(.42,.13,.07),new THREE.MeshBasicMaterial({color:0xff263f}));tail.position.set(x,.73,1.98);g.add(tail)}let glow=new THREE.PointLight(color,1.3,5);glow.position.set(0,.3,1.6);g.add(glow);return g}
const player=makeCar(0x00bde9);player.position.set(-2.1,0,6);scene.add(player);const player2=makeCar(0xffb52e);player2.position.set(2.1,0,10);scene.add(player2);
const rivalColors=[0xff344f,0xffb52e,0x965cff];const rivals=rivalColors.map((c,i)=>{let car=makeCar(c);car.position.set([-4.9,0,4.9][i],0,-24-i*19);scene.add(car);return {car,progress:35+i*22,speed:0.75+Math.random()*.3,lane:[-4.9,0,4.9][i]}}); 
const traffic=[];for(let i=0;i<7;i++){let car=makeCar([0xdce9f5,0x26b985,0x647c99][i%3]);car.scale.setScalar(.83);car.position.set([-4.9,0,4.9][i%3],0,-60-i*43);scene.add(car);traffic.push(car)}
let running=false,mode="cpu",steer=0,steer2=0,boosting=false,boosting2=false,braking=false,playerX=-2.1,playerX2=2.1,velocity=0,velocity2=0,nitro=100,nitro2=100,progress=0,progress2=0,elapsed=0,countdown=0,finished=false,shake=0;const total=4200,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));let last=0;
function hold(id,on,off){let e=document.getElementById(id);e.addEventListener('pointerdown',v=>{v.preventDefault();e.setPointerCapture(v.pointerId);on()});e.addEventListener('pointerup',v=>{v.preventDefault();off()});e.addEventListener('pointercancel',off)}hold('left',()=>steer=-1,()=>{if(steer<0)steer=0});hold('right',()=>steer=1,()=>{if(steer>0)steer=0});hold('boost',()=>boosting=true,()=>boosting=false);hold('brake',()=>braking=true,()=>braking=false);hold('p2left',()=>steer2=-1,()=>{if(steer2<0)steer2=0});hold('p2right',()=>steer2=1,()=>{if(steer2>0)steer2=0});hold('p2boost',()=>boosting2=true,()=>boosting2=false);
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')steer=-1;if(e.key==='ArrowRight'||e.key==='d')steer=1;if(e.key===' '||e.key==='Shift')boosting=true;if(e.key==='ArrowDown')steer2=1;if(e.key==='ArrowUp')boosting2=true;if(e.key==='Enter')boosting2=true;if(e.key==='ArrowDown'||e.key==='s')braking=true});addEventListener('keyup',e=>{if(['ArrowLeft','a','ArrowRight','d'].includes(e.key))steer=0;if(e.key===' '||e.key==='Shift')boosting=false;if(e.key==='ArrowDown')steer2=0;if(e.key==='ArrowUp'||e.key==='Enter')boosting2=false;if(e.key==='ArrowDown'||e.key==='s')braking=false});
function reset(selected){if(selected)mode=selected;running=true;finished=false;playerX=-2.1;playerX2=2.1;velocity=0;velocity2=0;progress=0;progress2=0;elapsed=0;nitro=100;nitro2=100;countdown=3;player.position.set(-2.1,0,6);player2.position.set(2.1,0,10);player2.visible=mode==='duo';document.getElementById('p2controls').style.display=mode==='duo'?'flex':'none';document.getElementById('p2tag').style.display=mode==='duo'?'block':'none';rivals.forEach((r,i)=>{r.progress=35+i*22;r.car.position.set(r.lane,0,-24-i*19);r.speed=.78+Math.random()*.2});traffic.forEach((c,i)=>c.position.set([-4.9,0,4.9][i%3],0,-60-i*43));overlay.style.display='none';hud.style.display='block';document.getElementById('countdown').textContent='3';}
document.getElementById('cpuMode').onclick=()=>reset('cpu');document.getElementById('duoMode').onclick=()=>reset('duo');
function finish(){running=false;finished=true;overlay.style.display='flex';hud.style.display='none';let rank=1+rivals.filter(r=>r.progress>progress).length+(mode==='duo'&&progress2>progress?1:0);document.getElementById('card').innerHTML='<div id="eyebrow">NEON CITY GRAND PRIX</div><h1>'+ winner +'</h1><p>Final position: <b>'+rank+'/4</b><br>Race time: '+document.getElementById('timer').textContent+'</p><button id="start">RACE AGAIN</button><div id="hint">Press to race again.</div>';document.getElementById('start').onclick=reset}
function loop(t){requestAnimationFrame(loop);let dt=Math.min((t-last)/1000||0,.035);last=t;if(running){if(countdown>0){countdown-=dt;document.getElementById('countdown').textContent=countdown>2?'3':countdown>1?'2':countdown>.15?'1':'GO!';if(countdown<=0)document.getElementById('countdown').textContent=''}else{elapsed+=dt;let target=boosting&&nitro>0?2.35:braking?.55:1.45;velocity+=(target-velocity)*dt*(braking?4:1.25);if(boosting&&nitro>0)nitro=Math.max(0,nitro-27*dt);else nitro=Math.min(100,nitro+8*dt);playerX=clamp(playerX+steer*dt*8.1*Math.max(.7,velocity),-5.7,5.7);player.position.x+=(playerX-player.position.x)*dt*8;let travel=velocity*dt*68;progress+=travel;if(mode==='duo'){let t2=boosting2&&nitro2>0?2.35:1.45;velocity2+=(t2-velocity2)*dt*1.25;if(boosting2&&nitro2>0)nitro2=Math.max(0,nitro2-27*dt);else nitro2=Math.min(100,nitro2+8*dt);playerX2=clamp(playerX2+steer2*dt*8.1*Math.max(.7,velocity2),-5.7,5.7);player2.position.x+=(playerX2-player2.position.x)*dt*8;progress2+=velocity2*dt*68;}player.rotation.z+=(-steer*(drifting?.25:.13)-player.rotation.z)*dt*6;player.rotation.y+=(-steer*.1-player.rotation.y)*dt*5;let travel=velocity*dt*68;progress+=travel;
for(let d of dashes){d.position.z+=travel;if(d.position.z>22)d.position.z-=420}for(let c of curbs){c.position.z+=travel;if(c.position.z>22)c.position.z-=424}for(let p of lamps){p.position.z+=travel;if(p.position.z>24)p.position.z-=418}for(let o of city){o.b.position.z+=travel;o.sign.position.z+=travel;if(o.b.position.z>35){o.b.position.z-=420;o.sign.position.z-=420}}
for(let r of rivals){r.progress+=travel*r.speed;let rel=r.progress-progress;r.car.position.z=6-rel*.36;r.car.position.x+=(r.lane-playerX*.12-r.car.position.x)*dt*1.5;if(Math.abs(rel)<4&&Math.abs(r.car.position.x-playerX)<2.4){velocity=Math.max(.55,velocity-.65);r.car.position.z-=2.5;shake=.22}}
for(let c of traffic){c.position.z+=travel*.78;if(c.position.z>17){c.position.z=-250-Math.random()*100;c.position.x=[-4.9,0,4.9][Math.floor(Math.random()*3)]}if(Math.abs(c.position.z-6)<2.5&&Math.abs(c.position.x-playerX)<2.15){velocity=Math.max(.45,velocity-.85);c.position.z-=4;shake=.3}}
shake=Math.max(0,shake-dt);camera.position.x+=((mode==='duo'?(playerX+playerX2)*.15:playerX*.3)-camera.position.x)*dt*3.2;camera.position.y=6.2+(boosting?.45:0);camera.position.z=13;camera.lookAt(playerX*.18,.8,-9);camera.fov=68+(boosting?5:0);camera.updateProjectionMatrix();
let rank=1+rivals.filter(r=>r.progress>progress).length;document.getElementById('position').textContent=mode==='duo'?'P1 '+rank+' • P2 '+(1+rivals.filter(r=>r.progress>progress2).length+(progress>progress2?1:0))+'/4':rank+'/4';document.getElementById('speed').textContent=Math.round(velocity*145);document.getElementById('nitro').style.width=nitro+'%';document.getElementById('lap').textContent=(Math.min(2,Math.floor(progress/2100)+1))+'/2';document.getElementById('timer').textContent=Math.floor(elapsed/60)+':'+String(Math.floor(elapsed%60)).padStart(2,'0');if(progress>=total||(mode==='duo'&&progress2>=total))finish()}}
renderer.render(scene,camera)}requestAnimationFrame(loop);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});})();
</script></body></html>
