<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Bearwood Adventure</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#8ed8f3;font-family:system-ui,Arial;color:#fff}canvas{display:block}#hud{position:fixed;inset:0;pointer-events:none}.top{display:flex;justify-content:space-between;padding:14px;gap:8px}.pill{background:#173d36dd;border:2px solid #ffffff55;border-radius:18px;padding:9px 14px;font-weight:800;text-shadow:0 2px 2px #0005;box-shadow:0 4px 12px #0002}.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;width:min(90%,440px);background:#173d36ed;border:3px solid #ffffff77;border-radius:26px;padding:24px;pointer-events:auto;box-shadow:0 12px 35px #174b3d66}.center h1{font-size:clamp(28px,7vw,48px);margin:0 0 8px}.center p{line-height:1.45}.btn{border:0;border-radius:16px;background:#ffd34f;color:#51350c;font-size:18px;font-weight:900;padding:13px 25px;box-shadow:0 5px 0 #c18a20;cursor:pointer}.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #c18a20}.hidden{display:none}.controls{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:space-between;align-items:end;padding:0 18px;pointer-events:none}.pad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,58px);gap:7px;pointer-events:auto}.pad.dpad .ctrl[data-key=forward]{grid-column:2;grid-row:1}.pad.dpad .ctrl[data-key=left]{grid-column:1;grid-row:2}.pad.dpad .ctrl[data-key=back]{grid-column:2;grid-row:2}.pad.dpad .ctrl[data-key=right]{grid-column:3;grid-row:2}.pad.jump-pad{display:flex;align-items:end;pointer-events:auto}.ctrl{width:58px;height:58px;border-radius:18px;border:2px solid #fff9;background:#174d43dd;color:white;font-size:25px;font-weight:900;touch-action:none;user-select:none;-webkit-user-select:none; -webkit-tap-highlight-color:transparent;box-shadow:0 4px 0 #103a33aa}.ctrl:active,.ctrl.pressed{background:#277e68;transform:translateY(2px);box-shadow:0 2px 0 #103a33aa}.ctrl.jump{width:78px;height:78px;border-radius:50%;background:#e89c2dee;font-size:17px;box-shadow:0 4px 0 #a95e20}.hint{position:absolute;bottom:155px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#173d36aa;padding:7px 12px;border-radius:12px;font-size:12px}@media(max-width:420px){.controls{padding:0 10px}.pad{grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,52px);gap:5px}.ctrl{width:52px;height:52px}.ctrl.jump{width:70px;height:70px}.hint{bottom:135px;font-size:11px}}
</style>
</head>
<body>
<div id="hud">
 <div class="top"><div class="pill">🐻 Bearwood Adventure</div><div class="pill">🪙 <span id="coins">0</span> / 12</div></div>
 <div id="menu" class="center"><h1>Bearwood Adventure</h1><p>Meet Bobo, explore the sunny island, and collect the golden berries!</p><p>Move with the arrow buttons or WASD. Jump with the orange button or Space.</p><button id="start" class="btn">START ADVENTURE</button></div>
 <div id="win" class="center hidden"><h1>🌟 Amazing!</h1><p>You collected all the golden berries!</p><button id="again" class="btn">PLAY AGAIN</button></div>
 <div class="hint">Explore the island • Collect 12 golden berries</div>
 <div class="controls"><div class="pad dpad"><button type="button" class="ctrl" data-key="forward" aria-label="Move forward">▲</button><button type="button" class="ctrl" data-key="left" aria-label="Move left">◀</button><button type="button" class="ctrl" data-key="back" aria-label="Move backward">▼</button><button type="button" class="ctrl" data-key="right" aria-label="Move right">▶</button></div><div class="pad jump-pad"><button type="button" class="ctrl jump" data-key="jump" aria-label="Jump">JUMP</button></div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(()=> {
const menu=document.getElementById('menu'),win=document.getElementById('win'),coinText=document.getElementById('coins');
if(!window.THREE){menu.innerHTML='<h1>Game could not load</h1><p>Please check your internet connection and reload.</p>';return;}
const scene=new THREE.Scene();scene.background=new THREE.Color(0x8ed8f3);scene.fog=new THREE.Fog(0x8ed8f3,28,75);
const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,150);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xdff7ff,0x5a7846,2));
const sun=new THREE.DirectionalLight(0xfff2d2,2.2);sun.position.set(-10,18,8);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);
const mat=(c,r=.85)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
const grass=mat(0x62bd59),sand=mat(0xe8ce88),bark=mat(0x80502d),leaf=mat(0x268c4c),leaf2=mat(0x42ad59),cream=mat(0xffe4bd),brown=mat(0x9a603b),dark=mat(0x35251e),eye=mat(0x171513),gold=mat(0xffca35,.35),blue=mat(0x4da9e8);
function mesh(g,m,x,y,z,sx=1,sy=1,sz=1){const o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.scale.set(sx,sy,sz);o.castShadow=true;o.receiveShadow=true;scene.add(o);return o}
mesh(new THREE.CylinderGeometry(17,19,2.2,64),grass,0,-1,0);
mesh(new THREE.CylinderGeometry(18,20,.7,64),sand,0,-2.15,0);
const water=mesh(new THREE.CylinderGeometry(32,32,.2,64),mat(0x35b8d7,.35),0,-2.65,0);water.receiveShadow=false;
for(let i=0;i<35;i++){let a=i*2.399,r=19+Math.sin(i*8)*1.3;mesh(new THREE.SphereGeometry(.3,8,6),mat(i%2?0x64d8e8:0x8de8ed),Math.cos(a)*r,-2.35,Math.sin(a)*r,1,.35,1)}
// rolling grassy mounds
for(let i=0;i<10;i++){let a=i*2.4,r=10+(i%3)*1.3;mesh(new THREE.SphereGeometry(1,16,12),grass,Math.cos(a)*r,-.15,Math.sin(a)*r,2.3,.65,1.8)}
// trees
for(let i=0;i<19;i++){let a=i*2.4,r=7.7+(i%4)*2.3,x=Math.cos(a)*r,z=Math.sin(a)*r;if(Math.hypot(x,z)<5)continue;mesh(new THREE.CylinderGeometry(.24,.38,2.2,8),bark,x,.4,z);mesh(new THREE.SphereGeometry(1.15,14,12),i%2?leaf:leaf2,x,1.85,z,1.2,1.35,1.2);mesh(new THREE.SphereGeometry(.75,12,10),leaf2,x+.55,2.25,z-.1,.95,.9,.95)}
// small colorful houses
for(let i=0;i<3;i++){let x=[-8,8,1][i],z=[-5,-6,10][i];mesh(new THREE.BoxGeometry(2.2,1.7,1.8),[blue,mat(0xffa45d),mat(0xf3e4a2)][i],x,.15,z);let roof=mesh(new THREE.ConeGeometry(1.75,.95,4),mat(0xc94f43),x,1.45,z);roof.rotation.y=Math.PI/4;mesh(new THREE.BoxGeometry(.55,.95,.12),bark,x,.0,z+.96)}
// path stones
for(let i=0;i<10;i++){let t=i/9;mesh(new THREE.CylinderGeometry(.55,.6,.12,8),mat(0xd8c39b),-2+t*4,.08,7-t*10)}
// bear character Bobo
const bear=new THREE.Group();scene.add(bear);
function part(g,m,x,y,z,sx=1,sy=1,sz=1){let o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.scale.set(sx,sy,sz);o.castShadow=true;bear.add(o);return o}
part(new THREE.SphereGeometry(.68,24,18),brown,0,1.05,0,1,1.08,.8);
part(new THREE.SphereGeometry(.5,24,18),cream,0,.92,.53,.83,.72,.32);
part(new THREE.SphereGeometry(.49,24,18),brown,0,1.92,0,1,1,.88);
part(new THREE.SphereGeometry(.19,16,12),brown,-.39,2.31,0,1,1,.7);part(new THREE.SphereGeometry(.19,16,12),brown,.39,2.31,0,1,1,.7);
part(new THREE.SphereGeometry(.105,12,10),cream,-.39,2.31,.105);part(new THREE.SphereGeometry(.105,12,10),cream,.39,2.31,.105);
part(new THREE.SphereGeometry(.105,12,10),eye,-.19,1.99,.405);part(new THREE.SphereGeometry(.105,12,10),eye,.19,1.99,.405);
part(new THREE.SphereGeometry(.19,16,12),cream,0,1.78,.48,.95,.65,.6);
part(new THREE.SphereGeometry(.09,12,8),dark,0,1.84,.77,1.2,.8,.7);
for(let s of [-1,1]){part(new THREE.SphereGeometry(.24,12,10),brown,s*.53,.58,0,.8,1,.8);part(new THREE.SphereGeometry(.25,12,10),brown,s*.32,.28,.08,1,.65,1)}
const scarf=part(new THREE.TorusGeometry(.43,.095,8,24),mat(0x36a8c9),0,1.48,0,1,1,.8);scarf.rotation.x=Math.PI/2;
bear.position.set(0,0,4);
// berries/coins
const berries=[];
for(let i=0;i<12;i++){let a=i*2.399,r=4.8+(i%4)*2.5,x=Math.cos(a)*r,z=Math.sin(a)*r;let group=new THREE.Group();group.position.set(x,.8,z);scene.add(group);let c=new THREE.Mesh(new THREE.SphereGeometry(.32,16,12),gold);c.castShadow=true;group.add(c);let stem=new THREE.Mesh(new THREE.CylinderGeometry(.035,.045,.18,7),leaf);stem.position.y=.32;group.add(stem);berries.push(group)}
const keys={};let collected=0,started=false,vy=0,onGround=true,heading=0;const speed=5.6;
function reset(){collected=0;coinText.textContent='0';berries.forEach(b=>b.visible=true);bear.position.set(0,0,4);vy=0;heading=0;win.classList.add('hidden');menu.classList.add('hidden');started=true}
document.getElementById('start').onclick=reset;document.getElementById('again').onclick=reset;
addEventListener('keydown',e=>{let k=e.key.toLowerCase();keys[k]=true;if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault()},{passive:false});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
document.querySelectorAll('.ctrl').forEach(b=>{const k=b.dataset.key;const release=e=>{keys[k]=false;b.classList.remove('pressed')};b.addEventListener('contextmenu',e=>e.preventDefault());b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;b.classList.add('pressed');try{b.setPointerCapture(e.pointerId)}catch(_){}});b.addEventListener('pointerup',e=>{e.preventDefault();release(e)});b.addEventListener('pointercancel',release);b.addEventListener('lostpointercapture',release)});
const clock=new THREE.Clock();
function animate(){requestAnimationFrame(animate);let dt=Math.min(clock.getDelta(),.04),t=clock.elapsedTime;
berries.forEach((b,i)=>{if(b.visible){b.rotation.y+=dt*1.5;b.position.y=.85+Math.sin(t*2+i)*.12}});
if(started){let forward=(keys['w']||keys['arrowup']||keys.forward?1:0)-(keys['s']||keys['arrowdown']||keys.back?1:0),side=(keys['d']||keys['arrowright']||keys.right?1:0)-(keys['a']||keys['arrowleft']||keys.left?1:0);/* Controls are camera-relative: up travels away from the camera, down returns toward it. */let forwardX=-Math.sin(heading),forwardZ=-Math.cos(heading),rightX=Math.cos(heading),rightZ=-Math.sin(heading);let v=new THREE.Vector3(rightX*side+forwardX*forward,0,rightZ*side+forwardZ*forward);if(v.lengthSq()>0){v.normalize();bear.position.x+=v.x*speed*dt;bear.position.z+=v.z*speed*dt;heading=Math.atan2(v.x,-v.z);bear.rotation.y=heading}bear.position.x=THREE.MathUtils.clamp(bear.position.x,-15.5,15.5);bear.position.z=THREE.MathUtils.clamp(bear.position.z,-15.5,15.5);
if((keys[' ']||keys.jump||keys['arrowup']&&keys.shift)&&onGround){vy=8;onGround=false}vy-=20*dt;bear.position.y+=vy*dt;if(bear.position.y<=0){bear.position.y=0;vy=0;onGround=true}
for(let b of berries){if(b.visible&&bear.position.distanceTo(b.position)<1.15){b.visible=false;collected++;coinText.textContent=collected;if(collected===12){started=false;win.classList.remove('hidden')}}}
}
const target=new THREE.Vector3(bear.position.x,1.1+bear.position.y,bear.position.z);let desired=new THREE.Vector3(bear.position.x+Math.sin(heading)*8,6.2+bear.position.y,bear.position.z+Math.cos(heading)*8);camera.position.lerp(desired,.08);camera.lookAt(target);renderer.render(scene,camera)}
animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
})();
</script>
</body></html>
