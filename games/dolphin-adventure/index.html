<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Dolphin Adventure</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#063b67;color:white;font-family:system-ui;text-align:center}header{padding:10px}h1{margin:3px}p{margin:3px;color:#d7f4ff}#hud{display:flex;justify-content:center;gap:24px;font-weight:800;padding:8px}canvas{display:block;width:min(96vw,850px);height:min(64vh,520px);margin:0 auto;border:4px solid #b8f1ff;border-radius:18px;background:#24a8d0;touch-action:none}#controls{display:flex;justify-content:center;gap:18px;padding:10px}button{border:0;border-radius:14px;padding:12px 22px;font-size:18px;font-weight:800;background:#ffe16b;color:#07365c}a{color:white}
</style></head><body><header><h1>🐬 Dolphin Adventure</h1><p>Swim through a sunny ocean, collect pearls and bubbles, and avoid the rocks!</p></header><div id="hud"><span id="score">Pearls: 0</span><span id="msg">Let's swim!</span></div><canvas id="game" width="850" height="520"></canvas><div id="controls"><button id="up">▲</button><button id="down">▼</button><button id="left">◀</button><button id="right">▶</button></div><p><a href="../../">← Back to Omar's Games Arcade</a></p>
<script>
const cv=document.querySelector('#game'),ctx=cv.getContext('2d');let d={x:120,y:260},score=0,items=[],rocks=[],keys={};function spawn(){items=Array.from({length:9},()=>({x:220+Math.random()*600,y:55+Math.random()*410,r:10}));rocks=Array.from({length:5},()=>({x:260+Math.random()*570,y:70+Math.random()*390,r:19}))}spawn();
function draw(){ctx.clearRect(0,0,850,520);let g=ctx.createLinearGradient(0,0,0,520);g.addColorStop(0,'#55d8ed');g.addColorStop(1,'#07518b');ctx.fillStyle=g;ctx.fillRect(0,0,850,520);ctx.fillStyle='#d6c78c';ctx.fillRect(0,480,850,40);for(let i=0;i<22;i++){ctx.strokeStyle='#ffffff55';ctx.beginPath();ctx.arc((i*79+performance.now()*.025)%850,((i*43)%460),3,0,7);ctx.stroke()}
items.forEach(p=>{ctx.fillStyle='#fff2a6';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(p.x-3,p.y-3,3,0,7);ctx.fill()});rocks.forEach(r=>{ctx.fillStyle='#627c8a';ctx.beginPath();ctx.ellipse(r.x,r.y,r.r*1.2,r.r,0,0,7);ctx.fill()});
ctx.save();ctx.translate(d.x,d.y);ctx.fillStyle='#67e6ed';ctx.beginPath();ctx.ellipse(0,0,42,22,0,0,7);ctx.fill();ctx.beginPath();ctx.moveTo(-30,0);ctx.lineTo(-53,-17);ctx.lineTo(-49,2);ctx.lineTo(-55,19);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(-2,-17);ctx.lineTo(12,-34);ctx.lineTo(18,-12);ctx.fill();ctx.fillStyle='#07365c';ctx.beginPath();ctx.arc(25,-5,3,0,7);ctx.fill();ctx.restore();
ctx.fillStyle='#fff';ctx.font='18px system-ui';ctx.fillText('Collect the shining pearls!',18,30);requestAnimationFrame(draw)}
function move(){if(keys.up)d.y-=3.5;if(keys.down)d.y+=3.5;if(keys.left)d.x-=3.5;if(keys.right)d.x+=3.5;d.x=Math.max(55,Math.min(800,d.x));d.y=Math.max(45,Math.min(455,d.y));items=items.filter(p=>{if(Math.hypot(p.x-d.x,p.y-d.y)<43){score++;document.querySelector('#score').textContent='Pearls: '+score;return false}return true});if(items.length===0){document.querySelector('#msg').textContent='Amazing! New pearls!';spawn()}requestAnimationFrame(move)}
[['up','up'],['down','down'],['left','left'],['right','right']].forEach(([id,k])=>{let b=document.getElementById(id);b.onpointerdown=e=>{e.preventDefault();keys[k]=true};b.onpointerup=b.onpointerleave=b.onpointercancel=()=>keys[k]=false});
cv.addEventListener('pointerdown',e=>{let r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*850/r.width,y=(e.clientY-r.top)*520/r.height;keys.up=y<d.y-20;keys.down=y>d.y+20;keys.left=x<d.x-20;keys.right=x>d.x+20});cv.addEventListener('pointerup',()=>Object.keys(keys).forEach(k=>keys[k]=false));requestAnimationFrame(draw);requestAnimationFrame(move);
</script></body></html>
