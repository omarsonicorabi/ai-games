<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Desert Drift Rally</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;padding:0;overflow:hidden!important;overscroll-behavior:none;touch-action:none}
body{position:fixed;inset:0;background:#101820;color:#fff;font-family:system-ui,Arial;height:100dvh;overflow:hidden}
#wrap{position:fixed;inset:0;width:100vw;height:100dvh;max-width:none;max-height:none;overflow:hidden;padding:5px;display:flex;flex-direction:column;gap:4px;min-height:0}
h1{font-size:clamp(16px,4.3vw,26px);line-height:1.05;margin:1px 0;color:#ffd166;text-align:center;flex:0 0 auto}
#hud{display:flex;justify-content:space-between;gap:3px;font-weight:800;background:#1c2b36;padding:6px 5px;border-radius:10px;flex:0 0 auto;font-size:clamp(9px,2.7vw,15px)}
canvas{display:block;flex:1 1 0;width:100%;height:0;min-height:0;max-height:none;aspect-ratio:auto;background:#d8a65e;border-radius:12px;border:2px solid #52616b;touch-action:none}
#overlay{position:absolute;top:clamp(64px,13dvh,110px);bottom:clamp(78px,14dvh,102px);left:5px;right:5px;margin:0;height:auto;display:flex;align-items:center;justify-content:center;pointer-events:none}
#panel{pointer-events:auto;text-align:center;background:rgba(12,25,38,.96);border:2px solid #ffd166;border-radius:18px;padding:clamp(7px,1.6dvh,14px);width:min(96%,720px);max-height:100%;overflow:hidden;box-shadow:0 8px 30px #0009}
#panel h2{margin:0 0 5px;color:#ffd166;font-size:clamp(19px,4.4vw,30px);line-height:1.1}
#panel p{margin:5px 0 8px;font-size:clamp(11px,2.7vw,15px);line-height:1.2}
#scoreGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3px;margin:5px 0 7px}
#scoreGrid div{background:#263744;border:1px solid #40515e;border-radius:6px;padding:3px 1px;font-size:clamp(9px,2.1vw,12px);white-space:nowrap}
button{border:2px solid #fff0b2;border-radius:14px;background:linear-gradient(180deg,#ffe28a,#ffb52e);color:#202a30;font-weight:1000;font-size:clamp(14px,3.5vw,19px);padding:10px 14px;cursor:pointer;box-shadow:0 4px 0 #9b651c,0 5px 12px #0005;text-shadow:0 1px #fff7}
#panel button{min-width:36%;margin:3px}
#controls{display:flex;justify-content:space-between;gap:7px;flex:0 0 auto;width:100%;padding-bottom:1px}
#controls button{flex:1;min-width:0;min-height:clamp(44px,7.5dvh,62px);padding:9px 2px;font-size:clamp(13px,3.8vw,21px);white-space:nowrap;touch-action:none}
#controls #left{background:linear-gradient(180deg,#7ed6ff,#2185e8);color:#071d32;border-color:#c9f2ff;box-shadow:0 4px 0 #14559b,0 5px 12px #0005}
#controls #boost{background:linear-gradient(180deg,#fff28a,#ff8a25);color:#3b1d00;border-color:#fff5bd;box-shadow:0 4px 0 #b34a0c,0 5px 12px #0005}
#controls #right{background:linear-gradient(180deg,#92f5bb,#20b96b);color:#062b1b;border-color:#d4ffe3;box-shadow:0 4px 0 #087943,0 5px 12px #0005}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #604014}
small{flex:0 0 auto;color:#d3dde2;text-align:center;font-size:clamp(8px,2vw,10px);line-height:1.05}
@media (max-height:620px){#wrap{gap:2px;padding:3px}h1{font-size:16px}#hud{padding:3px 5px}#controls button{min-height:38px;padding:5px 1px}small{font-size:8px}#overlay{top:48px;bottom:58px}#panel{padding:5px}#panel p{margin:3px 0 5px}#panel h2{font-size:18px}button{padding:6px 9px}}
</style>
</head>
<body><main id="wrap"><h1>🏜️ DESERT DRIFT RALLY</h1><div id="hud"><span>🏁 Distance: <b id="dist">0</b> m</span><span>⭐ Score: <b id="score">0</b></span><span>❤️ <b id="lives">1</b></span></div><canvas id="game" width="420" height="560"></canvas><div id="overlay"><div id="panel"><h2>Desert Rally!</h2><p>Dodge rocks and rival cars. Collect gold coins and survive the desert road.</p><button id="start">START RACE</button> <button id="scoresBtn">SCORES</button></div></div><div id="controls"><button id="left">◀ LEFT</button><button id="boost">⚡ BOOST</button><button id="right">RIGHT ▶</button></div><small>Keyboard: ← → or A / D · Space for boost · Works on phones too</small></main>
<script>
(()=>{const c=document.getElementById('game'),ctx=c.getContext('2d'),panel=document.getElementById('panel'),start=document.getElementById('start');
const W=c.width,H=c.height;let running=false,carX=210,objects=[],distance=0,score=0,lives=1,speed=3,boost=0,last=0,spawn=0;
const distEl=document.getElementById('dist'),scoreEl=document.getElementById('score'),livesEl=document.getElementById('lives');
function road(t){let half=70+t*105;return {left:W/2-half,right:W/2+half};}
function drawRoad(){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#e8c77d');g.addColorStop(1,'#bd7d3f');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
for(let i=0;i<18;i++){let y=(i*47+(distance*2)%47);ctx.fillStyle=i%2?'#b77b3d':'#d6a45c';ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(35,y-9);ctx.lineTo(49,y+4);ctx.lineTo(15,y+13);ctx.fill();ctx.beginPath();ctx.moveTo(W,y);ctx.lineTo(W-35,y-9);ctx.lineTo(W-49,y+4);ctx.lineTo(W-15,y+13);ctx.fill();}
ctx.fillStyle='#55565b';ctx.beginPath();ctx.moveTo(155,0);ctx.lineTo(265,0);ctx.lineTo(385,H);ctx.lineTo(35,H);ctx.closePath();ctx.fill();
ctx.strokeStyle='#fff0b5';ctx.lineWidth=4;ctx.setLineDash([28,24]);ctx.lineDashOffset=distance*2;ctx.beginPath();ctx.moveTo(210,0);ctx.lineTo(210,H);ctx.stroke();ctx.setLineDash([]);
ctx.strokeStyle='#e9c66d';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(156,0);ctx.lineTo(35,H);ctx.moveTo(264,0);ctx.lineTo(385,H);ctx.stroke();
}
function car(x,y,color,scale=1){ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);ctx.fillStyle='#151a1f';ctx.fillRect(-20,-4,8,19);ctx.fillRect(12,-4,8,19);ctx.fillRect(-20,27,8,18);ctx.fillRect(12,27,8,18);ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(-17,-14);ctx.quadraticCurveTo(-15,-27,0,-28);ctx.quadraticCurveTo(15,-27,17,-14);ctx.lineTo(21,32);ctx.quadraticCurveTo(0,42,-21,32);ctx.closePath();ctx.fill();ctx.fillStyle='#9de7f7';ctx.beginPath();ctx.moveTo(-12,-13);ctx.lineTo(-8,-22);ctx.lineTo(8,-22);ctx.lineTo(12,-13);ctx.closePath();ctx.fill();ctx.fillStyle='#ffe7a0';ctx.fillRect(-15,27,7,4);ctx.fillRect(8,27,7,4);ctx.restore();}
function draw(){drawRoad();for(const o of objects){let t=o.y/H,roadHalf=70+t*105,x=210+o.lane*roadHalf*.62; if(o.type==='coin'){ctx.fillStyle='#ffdc38';ctx.beginPath();ctx.ellipse(x,o.y,7+t*5,9+t*6,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff1a6';ctx.lineWidth=2;ctx.stroke();}else if(o.type==='rock'){ctx.fillStyle='#756b60';ctx.beginPath();ctx.moveTo(x-12-t*8,o.y+10);ctx.lineTo(x-8,o.y-8-t*7);ctx.lineTo(x+9,o.y-5);ctx.lineTo(x+15+t*7,o.y+10);ctx.closePath();ctx.fill();}else car(x,o.y,o.color,.55+t*.7);}
car(carX,465,'#ff5b35',1.15);
if(boost>0){ctx.fillStyle='#55e6ff';ctx.beginPath();ctx.moveTo(carX-9,506);ctx.lineTo(carX,540+Math.random()*12);ctx.lineTo(carX+9,506);ctx.fill();}
}
function update(dt){if(!running)return;let mult=boost>0?1.8:1;boost=Math.max(0,boost-dt);speed=3+distance/520;distance+=speed*dt*7*mult;spawn+=dt;if(spawn>Math.max(.22,.62-distance/9000)){spawn=0;let r=Math.random();objects.push({lane:Math.floor(Math.random()*3)-1,y:-20,type:r<.25?'coin':r<.57?'rock':'car',color:['#42c5a5','#e8d64b','#b18cff','#ff804f'][Math.floor(Math.random()*4)]});}
for(const o of objects){o.y+=(speed*65+o.y*.17)*dt*(boost>0?1.05:1);let t=o.y/H,half=70+t*105,x=210+o.lane*half*.62;if(o.y>430&&o.y<510&&Math.abs(x-carX)<30&&!o.hit){o.hit=true;if(o.type==='coin')score+=10;else{lives=0;livesEl.textContent=lives;endRace();}}}
objects=objects.filter(o=>o.y<H+50&&!o.hit);score+=Math.floor(dt*speed);distEl.textContent=Math.floor(distance);scoreEl.textContent=score;livesEl.textContent=lives;}
function loop(ts){let dt=Math.min(.04,(ts-last)/1000||0);last=ts;update(dt);draw();requestAnimationFrame(loop)}
function endRace(){running=false;panel.style.display='block';panel.innerHTML='<h2>RACE OVER!</h2><p>Distance: '+Math.floor(distance)+' m<br>Score: '+score+'</p><button id="again">RACE AGAIN</button>';document.getElementById('again').onclick=reset;}
function reset(){carX=210;objects=[];distance=score=0;lives=1;speed=3;boost=0;spawn=0;running=true;panel.style.display='none';}
start.onclick=reset;
document.getElementById('scoresBtn').onclick=showScores;
function showScores(){
  const scoreRows=Array.from({length:26},(_,i)=>'<div>'+((i+1)*100)+' pts</div>').join('');
  panel.innerHTML='<h2>🏆 SCORES</h2><p>26 score goals to beat!</p><div id="scoreGrid">'+scoreRows+'</div><button id="backMenu">BACK</button>';
  document.getElementById('backMenu').onclick=showMenu;
}
function showMenu(){
  panel.innerHTML='<h2>Desert Rally!</h2><p>You have only ONE health! Every crash ends the race. The road gets faster and faster as you survive.</p><button id="start">START RACE</button> <button id="scoresBtn">SCORES</button>';
  document.getElementById('start').onclick=reset;
  document.getElementById('scoresBtn').onclick=showScores;
}
function steer(dir){if(running)carX=Math.max(105,Math.min(315,carX+dir*28));}
document.getElementById('left').addEventListener('pointerdown',e=>{e.preventDefault();steer(-1)});document.getElementById('right').addEventListener('pointerdown',e=>{e.preventDefault();steer(1)});document.getElementById('boost').addEventListener('pointerdown',e=>{e.preventDefault();if(running)boost=1.4});
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')steer(-1);if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')steer(1);if(e.code==='Space'&&running)boost=1.4;if(e.code==='Space')e.preventDefault();});
requestAnimationFrame(loop);
})();
</script></body></html>
