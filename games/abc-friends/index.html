<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#b8ecff"><title>ABC Friends – Letter Adventure</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:"Trebuchet MS",Arial,sans-serif;color:#29415d;background:linear-gradient(160deg,#b8ecff,#fff1c8)}header{text-align:center;padding:22px 12px 14px}h1{font-size:clamp(2rem,7vw,3rem);margin:0;color:#ff687d;text-shadow:2px 3px white}header p{margin:8px 0 0;font-size:1.05rem}main{max-width:900px;margin:auto;padding:12px 16px 30px}.home-intro{text-align:center;background:#fff;border-radius:22px;padding:13px;margin:0 auto 16px;max-width:600px;box-shadow:0 5px 0 #c4dce9;font-weight:bold}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:11px}.tile{border:0;border-radius:20px;background:white;min-height:100px;padding:9px 5px;box-shadow:0 5px 0 #c4dce9;cursor:pointer;color:#31435b}.tile:active,.action:active{transform:translateY(3px);box-shadow:0 2px 0 #c4dce9}.tile .letter{font-size:2.7rem;font-weight:900;line-height:1;color:var(--c)}.tile .emoji{display:block;font-size:1.6rem;margin-top:4px}.detail{display:none;background:#fff;border-radius:28px;padding:18px 16px;text-align:center;max-width:600px;margin:0 auto;box-shadow:0 7px 0 #c4dce9}.detail.show{display:block}.home.hidden{display:none}.back{display:block;margin:0 auto 12px;border:0;background:#e8f5ff;border-radius:24px;padding:10px 16px;font-weight:bold;color:#31516e;cursor:pointer}.bigletter{font-size:clamp(6rem,24vw,9rem);font-weight:1000;color:#ff7180;line-height:1}.bigemoji{font-size:clamp(4rem,17vw,6rem);margin:4px}h2{font-size:clamp(1.5rem,5vw,2rem);margin:7px 0;color:#37516d}.explain{font-size:1.15rem;line-height:1.5;margin:8px auto;max-width:440px}.sound{font-weight:bold;color:#6a68b5}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:15px}.action{border:0;border-radius:30px;padding:12px 19px;background:#62d0ad;color:#174b48;font-weight:bold;font-size:1rem;cursor:pointer;box-shadow:0 4px 0 #b8d9d1}.action.alt{background:#ffd16e;color:#614719;box-shadow:0 4px 0 #e8d29c}footer{text-align:center;padding:0 12px 24px;color:#58718b;font-size:.9rem}@media(max-width:420px){.grid{grid-template-columns:repeat(3,1fr)}}
</style></head><body><header><h1>🌈 ABC Friends! 🌈</h1><p>Choose a letter to learn about it!</p></header><main><section class="home" id="home"><div class="home-intro">👆 Tap any letter to open its learning page!</div><div class="grid" id="grid"></div></section><section class="detail" id="detail" aria-live="polite"><button class="back" id="back">⬅ Back to all letters</button><div class="bigletter" id="bigletter">A</div><div class="bigemoji" id="bigemoji">🍎</div><h2 id="title">A is for Apple!</h2><p class="explain" id="explain">An apple is a fruit. It can be red, green, or yellow. 🍎</p><p class="sound" id="sound">A makes the “ah” sound.</p><div class="actions"><button class="action" id="hear">🔊 Hear the letter</button><button class="action alt" id="next">Next letter ➜</button></div></section></main><footer>Little steps, big learning! ⭐</footer>
<script>
const data=[['A','🍎','Apple','An apple is a fruit. It can be red, green, or yellow.','ah'],['B','🐻','Bear','A bear is a big, furry animal.','buh'],['C','🐱','Cat','A cat is a small animal that says meow.','kuh'],['D','🐶','Dog','A dog is a friendly animal that can bark.','duh'],['E','🐘','Elephant','An elephant is a very big animal with a long trunk.','eh'],['F','🐟','Fish','A fish lives in water and swims with its fins.','fff'],['G','🦒','Giraffe','A giraffe is tall and has a very long neck.','guh'],['H','🏠','House','A house is a place where people live.','huh'],['I','🍦','Ice cream','Ice cream is a cold, sweet treat.','eye'],['J','🫙','Jar','A jar is a container that can hold things.','juh'],['K','🪁','Kite','A kite can fly high in the sky when it is windy.','kuh'],['L','🦁','Lion','A lion is a big wild cat.','lll'],['M','🌙','Moon','The moon shines in the night sky.','mmm'],['N','🪺','Nest','A nest is a home where a bird can lay its eggs.','nnn'],['O','🐙','Octopus','An octopus lives in the sea and has eight arms.','oh'],['P','🐧','Penguin','A penguin is a bird that cannot fly but can swim.','puh'],['Q','👑','Queen','A queen is a woman who rules a kingdom.','kw'],['R','🤖','Robot','A robot is a machine that can do tasks.','rrr'],['S','☀️','Sun','The sun gives us light and warmth.','sss'],['T','🐢','Turtle','A turtle is an animal with a hard shell.','tuh'],['U','☂️','Umbrella','An umbrella helps keep us dry in the rain.','uh'],['V','🎻','Violin','A violin is a musical instrument.','vuh'],['W','🐳','Whale','A whale is a very large animal that lives in the ocean.','wuh']];
let current=0;const grid=document.getElementById('grid'),home=document.getElementById('home'),detail=document.getElementById('detail');
data.forEach((d,i)=>{const b=document.createElement('button');b.className='tile';b.style.setProperty('--c',['#ff7180','#48a9dc','#9b78dc','#f2a33c','#48b99a'][i%5]);b.innerHTML='<span class="letter">'+d[0]+'</span><span class="emoji">'+d[1]+'</span>';b.setAttribute('aria-label','Learn letter '+d[0]);b.onclick=()=>openLetter(i);grid.appendChild(b)});
function openLetter(i){current=(i+data.length)%data.length;const d=data[current];document.getElementById('bigletter').textContent=d[0];document.getElementById('bigemoji').textContent=d[1];document.getElementById('title').textContent=d[0]+' is for '+d[2]+'!';document.getElementById('explain').textContent=d[3];document.getElementById('sound').textContent='The letter '+d[0]+' makes the “'+d[4]+'” sound.';home.classList.add('hidden');detail.classList.add('show');window.scrollTo(0,0)}
function goHome(){detail.classList.remove('show');home.classList.remove('hidden');window.scrollTo(0,0)}
function speak(){const d=data[current];if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(d[0]+'. '+d[0]+' is for '+d[2]+'. '+d[3]);u.rate=.82;u.pitch=1.12;speechSynthesis.speak(u)}
document.getElementById('back').onclick=goHome;document.getElementById('hear').onclick=speak;document.getElementById('next').onclick=()=>{openLetter(current+1);speak()};
</script></body></html>
