function spawnObs(){let up=Math.random()<.56;let w=82+Math.random()*38,h=82+Math.random()*48;let y=up?H*.76:H*.1;obs.push({x:W+60,y,w,h,up,passed:false});if(Math.random()<.85)coins.push({x:W+60+w+25,y:up?y-h-20:y+h+24,t:false})}
function intersects(o){
 // Check the triangle's actual sloping sides, not its whole rectangular bounding box.
 // A little extra clearance around the boy makes grazing pyramid corners fairer.
 const px=player.x, py=player.y, halfW=9, halfH=15;
 const left=o.x-o.w/2, right=o.x+o.w/2;
 const top=Math.min(o.y,o.up?o.y-o.h:o.y+o.h);
 const bottom=Math.max(o.y,o.up?o.y-o.h:o.y+o.h);
 const samples=[px-halfW,px,px+halfW];
 for(const sx of samples){
   if(sx<left||sx>right) continue;
   const ratio=(sx-left)/o.w;
   const edgeY=o.up ? o.y-o.h*(1-Math.abs(2*ratio-1)) : o.y+o.h*(1-Math.abs(2*ratio-1));
   const triMin=o.up?edgeY:o.y, triMax=o.up?o.y:edgeY;
   if(py+halfH>triMin+5 && py-halfH<triMax-5) return true;
 }
 return false;
}
